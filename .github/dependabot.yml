# Weekly pull requests for dependency updates, grouped so they don't flood the repository.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major versions change APIs (e.g. Tailwind 4, React 19, pino-http 11) and need a planned
    # migration, not an automatic bump: they are upgraded by hand.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
