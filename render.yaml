# Render Blueprint for the API (https://render.com/docs/blueprint-spec).
# The live service was created by hand in the Render dashboard with these same settings: the
# dashboard is what Render uses, and this file records it (keep them in step) and can recreate
# the service as a Blueprint. The web app reaches the API through the /api rewrite in
# apps/web/vercel.json. See docs/deployment.md.
services:
  - type: web
    name: ru-lost-found-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health/live
    autoDeploy: true
    # Deploy only when something the API image uses changes, so web-only and docs-only pushes
    # don't restart the API (on the free plan a deploy can leave it unreachable for minutes).
    # On the live service this is set in the dashboard: Settings → Build Filters.
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - package.json
        - package-lock.json
        - tsconfig.base.json
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Measured with /api/v1/health/client: visitor → Vercel → Cloudflare → Render's load
      # balancer → app. Re-check after any hosting change (docs/deployment.md).
      - key: TRUST_PROXY_HOPS
        value: '4'
      - key: APP_URL
        value: https://ru-lost-found.vercel.app
      - key: CORS_ORIGINS
        value: https://ru-lost-found.vercel.app
      - key: WORKER_ENABLED
        value: 'true'
      # Sample data for visitors (docs/demo-data.md). Set to 'false' before real users arrive.
      - key: DEMO_MODE
        value: 'true'
      - key: BCRYPT_ROUNDS
        value: '12'
      - key: APP_SECRET
        generateValue: true
      # Secrets: set in the Render dashboard, never in this file.
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      # The owners' accounts, made platform admins automatically (see apps/api/.env.example).
      - key: ADMIN_EMAILS
        sync: false

  # Scaling up (docs/deployment.md, "Scaling up"): on a paid plan, change `plan: free` above to
  # `starter` (always on, no sleep) and, when one instance is no longer enough, run the background
  # worker as its own service. Uncomment the block below, give it the same environment variables
  # as the API (an environment group shared by both is easiest), and set WORKER_ENABLED to 'false'
  # on the API. No code changes: the API image already contains dist/worker.js. Background
  # workers have no free plan on Render.
  #
  # - type: worker
  #   name: ru-lost-found-worker
  #   runtime: docker
  #   dockerfilePath: ./apps/api/Dockerfile
  #   dockerContext: .
  #   dockerCommand: node dist/worker.js
  #   plan: starter
  #   region: singapore
  #   autoDeploy: true
